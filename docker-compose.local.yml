services:
  postgres:
    image: postgres:16
    container_name: lr7-postgres-local
    environment:
      POSTGRES_DB: scaling_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scaling_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_local_data:
